<div class="login-wrapper">
  <form class="login-card" autocomplete="off">
    <h1>Connexion</h1>
    <div class="login-inner">
      <input type="text" id="login" placeholder="Login *" autocomplete="username" required />
      <input type="password" id="password" placeholder="Mot de passe *" autocomplete="current-password" required />
      <button type="submit">Connexion</button>
    </div>
    <div class="error"></div>
  </form>
</div>
