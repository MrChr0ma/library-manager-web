<h1>Modifier un auteur</h1>
<form id="edit-author-form" autocomplete="off">
  <input type="text" id="name" placeholder="Nom de l'auteur" required />
  <div class="submit-row">
    <button type="submit">Valider les modifications</button>
  </div>
  <div class="message"></div>
</form>
<h2 class="book-list-title">Liste des livres de cet auteur</h2>
<table>
  <thead>
    <tr>
      <th>Nom du livre</th>
      <th>État</th>
    </tr>
  </thead>
  <tbody id="books"></tbody>
</table>
