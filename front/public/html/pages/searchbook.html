<h1>Rechercher un livre</h1>
<form class="search-bar" id="search-form">
  <input type="text" id="search" placeholder="Recherche par nom" />
  <button type="submit">Filtrer</button>
</form>
<table>
  <thead>
    <tr>
      <th>Nom du livre</th>
      <th>Auteur</th>
      <th>État</th>
    </tr>
  </thead>
  <tbody id="results"></tbody>
</table>
